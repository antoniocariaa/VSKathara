LAB_NAME="VSKathara Test Lab"
LAB_DESCRIPTION="Tests all linting rules and completions"
LAB_VERSION=1.0
LAB_AUTHOR="VSKathara"

# ── Valid router ──────────────────────────────────────────────────────────────
r1[0]="A"
r1[1]="B"
r1[image]="kathara/frr"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[mem]="128m"
r1[cpus]=0.5

# ── Valid PC with MAC address ─────────────────────────────────────────────────
pc1[0]="A/02:42:ac:11:00:01"
pc1[image]="kathara/base"
pc1[bridged]="true"

# ── Valid PC with port forward ────────────────────────────────────────────────
pc2[0]="C"
pc2[port]="3000:22/tcp"
pc2[shell]="/bin/bash"
pc2[num_terms]=1
pc2[env]="MY_VAR=hello"
pc2[exec]="echo 'started'"
pc2[volume]="/data|/mnt/data|rw"

# ─────────────────────────────────────────────────────────────────────────────
# INTENTIONAL ERRORS BELOW — diagnostics should highlight these
# ─────────────────────────────────────────────────────────────────────────────

# ERROR: interface index skips 0 (missing index 0)
bad1[1]="D"
bad1[2]="E"

# ERROR: collision domain with a dot in the name
bad2[0]="bad.domain"

# ERROR: invalid MAC address format
bad3[0]="F/ZZ:ZZ:ZZ:ZZ:ZZ:ZZ"

# ERROR: mem below 4m
bad4[mem]="2m"

# ERROR: mem invalid suffix
bad5[mem]="128x"

# ERROR: port invalid format
bad6[port]="notaport"

# ERROR: sysctl not in net.* namespace
bad7[sysctl]="kernel.hostname=test"

# ERROR: boolean option with non-boolean value
bad8[bridged]="yes"

# ERROR: invalid env format
bad9[env]="NOEQUAL"

# ERROR: invalid volume format (missing | separator)
bad10[volume]="/host-/guest"

# WARNING: unknown option
bad11[unknownoption]="value"
