LAB_NAME="Simple Routing Lab"
LAB_DESCRIPTION="A basic lab with two routers and two PCs"
LAB_VERSION=1.0
LAB_AUTHOR="Kathara Users"

# ── Routers ───────────────────────────────────────────────────────────────────

r1[0]="A"
r1[1]="B"
r1[image]="kathara/frr"
r1[sysctl]="net.ipv4.ip_forward=1"
r1[mem]="128m"

r2[0]="B"
r2[1]="C"
r2[image]="kathara/frr"
r2[sysctl]="net.ipv4.ip_forward=1"
r2[mem]="128m"

# ── PCs ───────────────────────────────────────────────────────────────────────

pc1[0]="A"
pc1[image]="kathara/base"

pc2[0]="C"
pc2[image]="kathara/base"
pc2[bridged]="true"
